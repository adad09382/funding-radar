name: Collect Funding Rates

on:
  schedule:
    - cron: "0 */4 * * *"   # 每 4 小時補齊一次，自動回補缺口
  workflow_dispatch:          # 手動觸發

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: 初始化 DB schema
        run: npx tsx scripts/init-db.ts
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: 增量補齊（OKX / Bitget / MEXC / Gate / HTX / KuCoin / Hyperliquid / Trade.xyz）
        run: npx tsx scripts/incremental.ts
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: 增量補齊（Binance / Bybit / AsterDEX，經 Vercel）
        run: |
          curl -f --max-time 120 -X POST \
            "${{ secrets.COLLECT_URL }}/api/collect?secret=${{ secrets.COLLECT_SECRET }}"
